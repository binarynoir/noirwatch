name: Release Application

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release pushed tag
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP: noirwatch
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the tag matches the script version
        run: |
          script_version=$(grep -Eo '^(readonly )?VERSION=[0-9]+\.[0-9]+\.[0-9]+' "$APP" | cut -d= -f2)
          if [[ "v$script_version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match VERSION=$script_version in $APP"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo="$GITHUB_REPOSITORY" \
            --title="${GITHUB_REPOSITORY#*/} ${TAG#v}" \
            --generate-notes

      - name: Calculate SHA-256 checksum of the source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$APP-$TAG.tar.gz" \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          echo "SHA256_SUM=$(sha256sum "$APP-$TAG.tar.gz" | awk '{ print $1 }')" >> "$GITHUB_ENV"

      - name: Checkout Homebrew repository
        uses: actions/checkout@v4
        with:
          repository: binarynoir/homebrew-noirwatch
          path: homebrew-noirwatch
          token: ${{ secrets.TARGET_REPO_PAT }}

      - name: Update and push the Homebrew formula
        working-directory: homebrew-noirwatch
        run: |
          if [[ ! -f "$APP.rb" ]]; then
            echo "::warning::$APP.rb not found in homebrew-$APP; skipping the formula update"
            exit 0
          fi
          sed -i "s|url \".*\"|url \"https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz\"|" "$APP.rb"
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256_SUM\"|" "$APP.rb"
          if git diff --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Update $APP.rb for version $TAG"
          git push origin HEAD:main
