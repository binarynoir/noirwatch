name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck -s bash noirwatch test/*.sh scripts/*.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq libxml2-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils jq
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: ./test/test.sh
